<!DOCTYPE html>
<title>My Page</title>
<body class="html button">  
    ## html button
    1 submit button<br/>
    <button type="submit">Submit</button><br/>
    2 reset button<br/>
    <button type="reset">reset</button><br/>
    3 button<br/>
    <button type="button">button</button><br/>
    ## html input<br/>
    1 text input<br/>
    <input type="text" name="name" placeholder="Enter your name"><br/>
    2 password input<br/>
    <input type="password" name="password" placeholder="Enter your password"><br/>
    3 email input<br/>
    <input type="email" name="email" placeholder="Enter your email"><br/>
    4 number input<br/>
    <input type="number" name="age" placeholder="Enter your age"><br/>
    5 date input<br/>
    <input type="date" name="date"><br/>
    6 color input<br/>
    <input type="color" name="color"><br/>
    7 range input<br/>
    <input type="range" name="range" min="0" max="100"><br/>
    8 file input<br/>
    <input type="file" name="file"><br/>
    9 checkbox input<br/>
    <input type="checkbox" name="checkbox"><br/>
    10 radio input<br/>
    <input type="radio" name="radio"> <br/>  
    11 search input<br/>
    <input type="search" name="search" placeholder="Search..."><br/>
    12 url input<br/>
    <input type="url" name="url" placeholder="Enter your website URL"><br/>
    13 tel input<br/>
    <input type="tel" name="tel" placeholder="Enter your phone number"><br/>
    14 time input<br/>
    <input type="time" name="time"><br/>
</body>
</html>
